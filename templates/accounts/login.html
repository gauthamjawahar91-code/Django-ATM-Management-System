{% extends 'base.html' %}

{% block title %}
Login
{% endblock title %}

{% block operation_title %}
<h2 class="fw-bold text-center">ATM Login</h2>
{% endblock operation_title %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6 col-lg-5">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <h5 class="text-center mb-4">
                    Login to Your Account
                </h5>

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-3">
                        {{ login_form.as_p }}
                    </div>

                    <div class="d-grid">
                        <button type="submit"
                                class="btn btn-primary">
                            Login
                        </button>
                    </div>

                </form>

                <div class="text-center mt-3">

                    <p class="mb-1">
                        Don't have an account?
                    </p>

                    <a href="{% url 'register' %}"
                       class="text-decoration-none">
                        Create an Account
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock content %}
